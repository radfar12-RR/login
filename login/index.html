
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه ورود</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .login-box h1 {
            text-align: center;
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #444;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
            background: #fafafa;
        }

        .input-group input:focus {
            border-color: #764ba2;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.12);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #555;
        }

        a {
            color: #764ba2;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(118, 75, 162, 0.3);
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 450px) {
            .login-box {
                padding: 30px 22px;
            }

            .login-box h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>خوش آمدید!</h1>
        <p class="subtitle">برای ورود، اطلاعات خود را وارد کنید.</p>

        <form action="#" method="post">

            <div class="input-group">
                <label for="email">ایمیل</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">رمز عبور</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="رمز عبور خود را وارد کنید"
                    required
                >
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" name="remember">
                    مرا به خاطر بسپار
                </label>

                <a href="#">فراموشی رمز عبور؟</a>
            </div>

            <button type="submit" class="login-btn">
                ورود به حساب
            </button>

        </form>

        <div class="register">
            حساب کاربری ندارید؟
            <a href="#">ثبت‌نام کنید</a>
        </div>

    </div>

</body>
</html>
